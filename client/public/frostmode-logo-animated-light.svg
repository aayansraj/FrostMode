<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="textIceGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2447"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="iconIceGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <filter id="lightLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Inter:wght@700&amp;display=swap');
    
    @keyframes logoSpinLight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes logoPulseLight {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .icon-spin-light {
      transform-origin: 60px 60px;
      animation: logoSpinLight 25s linear infinite;
    }
    .icon-pulse-light {
      transform-origin: 60px 60px;
      animation: logoPulseLight 3s ease-in-out infinite;
    }
    .title-text-light {
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -1px;
    }
    .tagline-text-light {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 5px;
    }
  </style>

  <!-- Left Icon Group -->
  <g transform="translate(0, 0)">
    <!-- Aura Glow Background -->
    <circle cx="60" cy="60" r="45" fill="#bae6fd" opacity="0.6" class="icon-pulse-light" />

    <!-- Rotating Crystal Ring -->
    <g class="icon-spin-light" opacity="0.7">
      <circle cx="60" cy="60" r="42" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 8"/>
    </g>

    <!-- Snowflake -->
    <g stroke="url(#iconIceGradLight)" stroke-width="3" stroke-linecap="round">
      <!-- Hexagon Core -->
      <polygon points="60,49 69,54 69,66 60,71 51,66 51,54" fill="none" stroke-width="2" />
      <circle cx="60" cy="60" r="3" fill="#0284c7" />

      <!-- Arms -->
      <line x1="60" y1="49" x2="60" y2="20" />
      <path d="M60,32 L69,24 M60,32 L51,24" />
      <circle cx="60" cy="17" r="2.5" fill="#0284c7" />

      <line x1="60" y1="71" x2="60" y2="100" />
      <path d="M60,88 L69,96 M60,88 L51,96" />
      <circle cx="60" cy="103" r="2.5" fill="#0284c7" />

      <g transform="rotate(60 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#0284c7" />
      </g>

      <g transform="rotate(-60 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#0284c7" />
      </g>

      <g transform="rotate(120 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#0284c7" />
      </g>

      <g transform="rotate(-120 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#0284c7" />
      </g>
    </g>
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(130, 0)">
    <!-- Main Title -->
    <text x="0" y="66" fill="url(#textIceGradLight)" class="title-text-light">FrostMode</text>
    
    <!-- Subtitle Tagline -->
    <text x="3" y="92" fill="#0284c7" class="tagline-text-light" opacity="0.9">LOCK IN. LEVEL UP.</text>
  </g>
</svg>
