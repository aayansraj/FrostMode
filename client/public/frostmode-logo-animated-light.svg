<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- Text Light Gradient -->
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b2447"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Snowflake Light Gradient -->
    <linearGradient id="flakeGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="lightSuperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Inter:wght@800&amp;display=swap');
    
    @keyframes spinCWLight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCCWLight {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes auraPulseLight {
      0%, 100% { transform: scale(0.92); opacity: 0.5; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    @keyframes taglineGlowLight {
      0%, 100% { opacity: 0.85; letter-spacing: 5px; }
      50% { opacity: 1; letter-spacing: 6px; }
    }

    .spin-cw-light {
      transform-origin: 60px 60px;
      animation: spinCWLight 18s linear infinite;
    }
    .spin-ccw-light {
      transform-origin: 60px 60px;
      animation: spinCCWLight 12s linear infinite;
    }
    .aura-pulse-light {
      transform-origin: 60px 60px;
      animation: auraPulseLight 3s ease-in-out infinite;
    }
    .main-title-light {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: -1.5px;
    }
    .sub-tagline-light {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 13px;
      animation: taglineGlowLight 3s ease-in-out infinite;
    }
  </style>

  <!-- Left Snowflake Icon -->
  <g transform="translate(0, 0)">
    <!-- Soft Blue Aura Layer -->
    <circle cx="60" cy="60" r="48" fill="#bae6fd" class="aura-pulse-light" />
    <circle cx="60" cy="60" r="38" fill="#e0f2fe" opacity="0.6" />

    <!-- Outer Compass Ring (Clockwise) -->
    <g class="spin-cw-light">
      <circle cx="60" cy="60" r="45" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.8" />
      <circle cx="60" cy="15" r="2.5" fill="#0284c7" />
      <circle cx="60" cy="105" r="2.5" fill="#0284c7" />
      <circle cx="15" cy="60" r="2.5" fill="#0284c7" />
      <circle cx="105" cy="60" r="2.5" fill="#0284c7" />
    </g>

    <!-- Inner Geometry Ring (Counter-Clockwise) -->
    <g class="spin-ccw-light">
      <circle cx="60" cy="60" r="32" fill="none" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.85" />
      <polygon points="60,28 64,34 56,34" fill="#0284c7" />
      <polygon points="60,92 64,86 56,86" fill="#0284c7" />
    </g>

    <!-- Main Crystal Snowflake Arms -->
    <g stroke="url(#flakeGradLight)" stroke-width="3.2" stroke-linecap="round" filter="url(#lightSuperGlow)">
      <!-- Hexagon Core -->
      <polygon points="60,48 70,54 70,66 60,72 50,66 50,54" fill="none" stroke="#0b2447" stroke-width="2" />
      <circle cx="60" cy="60" r="4.5" fill="#0284c7" />

      <!-- Vertical Arm -->
      <line x1="60" y1="48" x2="60" y2="18" />
      <path d="M60,32 L70,22 M60,32 L50,22 M60,40 L67,33 M60,40 L53,33" stroke-width="2.5" />
      <circle cx="60" cy="15" r="3.5" fill="#0284c7" />

      <line x1="60" y1="72" x2="60" y2="102" />
      <path d="M60,88 L70,98 M60,88 L50,98 M60,80 L67,87 M60,80 L53,87" stroke-width="2.5" />
      <circle cx="60" cy="105" r="3.5" fill="#0284c7" />

      <!-- Arm 60 deg -->
      <g transform="rotate(60 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#0284c7" />
      </g>

      <!-- Arm -60 deg -->
      <g transform="rotate(-60 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#0284c7" />
      </g>

      <!-- Arm 120 deg -->
      <g transform="rotate(120 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#0284c7" />
      </g>

      <!-- Arm -120 deg -->
      <g transform="rotate(-120 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#0284c7" />
      </g>
    </g>
  </g>

  <!-- Typography Group -->
  <g transform="translate(132, 0)">
    <!-- Main Title "FrostMode" -->
    <text x="0" y="66" fill="url(#textGradLight)" class="main-title-light">FrostMode</text>
    
    <!-- Subtitle "LOCK IN. LEVEL UP." -->
    <text x="4" y="93" fill="#0284c7" class="sub-tagline-light">LOCK IN. LEVEL UP.</text>
  </g>
</svg>
