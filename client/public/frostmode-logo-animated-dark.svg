<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- Text Ice Gradient with Neon Cyan -->
    <linearGradient id="neonIceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Snowflake Gradient -->
    <linearGradient id="flakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Inter:wght@800&amp;display=swap');
    
    /* 1. Clockwise slow rotation for outer ring */
    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* 2. Counter-clockwise rotation for inner ring */
    @keyframes spinCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    
    /* 3. Aura pulsing glow */
    @keyframes auraPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.45; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }

    /* 4. Sparkling Tip Stars */
    @keyframes sparkScale {
      0%, 100% { transform: scale(0.6); opacity: 0.3; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    /* 5. Text Energy Pulse */
    @keyframes textGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(0, 242, 255, 0.85)); }
    }

    /* 6. Tagline Shimmer */
    @keyframes taglineGlow {
      0%, 100% { opacity: 0.8; letter-spacing: 5px; }
      50% { opacity: 1; letter-spacing: 6px; }
    }

    .spin-cw {
      transform-origin: 60px 60px;
      animation: spinCW 18s linear infinite;
    }
    .spin-ccw {
      transform-origin: 60px 60px;
      animation: spinCCW 12s linear infinite;
    }
    .aura-pulse {
      transform-origin: 60px 60px;
      animation: auraPulse 3s ease-in-out infinite;
    }
    .sparkle-node {
      transform-origin: center;
      animation: sparkScale 2s ease-in-out infinite;
    }
    .main-title {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: -1.5px;
      animation: textGlowPulse 4s ease-in-out infinite;
    }
    .sub-tagline {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 13px;
      animation: taglineGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Left Snowflake Icon -->
  <g transform="translate(0, 0)">
    <!-- Cyan Neon Aura Layer -->
    <circle cx="60" cy="60" r="48" fill="#0284c7" class="aura-pulse" filter="url(#superGlow)" />
    <circle cx="60" cy="60" r="38" fill="#06b6d4" opacity="0.3" class="aura-pulse" />

    <!-- Outer Compass Ring (Clockwise) -->
    <g class="spin-cw">
      <circle cx="60" cy="60" r="45" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.85" />
      <circle cx="60" cy="15" r="2.5" fill="#00f2ff" />
      <circle cx="60" cy="105" r="2.5" fill="#00f2ff" />
      <circle cx="15" cy="60" r="2.5" fill="#00f2ff" />
      <circle cx="105" cy="60" r="2.5" fill="#00f2ff" />
    </g>

    <!-- Inner Geometry Ring (Counter-Clockwise) -->
    <g class="spin-ccw">
      <circle cx="60" cy="60" r="32" fill="none" stroke="#00f2ff" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.9" />
      <polygon points="60,28 64,34 56,34" fill="#38bdf8" />
      <polygon points="60,92 64,86 56,86" fill="#38bdf8" />
    </g>

    <!-- Main Crystal Snowflake Arms -->
    <g stroke="url(#flakeGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#superGlow)">
      <!-- Hexagon Core -->
      <polygon points="60,48 70,54 70,66 60,72 50,66 50,54" fill="none" stroke="#ffffff" stroke-width="2" />
      <circle cx="60" cy="60" r="4.5" fill="#ffffff" />

      <!-- Vertical Arm -->
      <line x1="60" y1="48" x2="60" y2="18" />
      <path d="M60,32 L70,22 M60,32 L50,22 M60,40 L67,33 M60,40 L53,33" stroke-width="2.5" />
      <circle cx="60" cy="15" r="3.5" fill="#ffffff" class="sparkle-node" />

      <line x1="60" y1="72" x2="60" y2="102" />
      <path d="M60,88 L70,98 M60,88 L50,98 M60,80 L67,87 M60,80 L53,87" stroke-width="2.5" />
      <circle cx="60" cy="105" r="3.5" fill="#ffffff" class="sparkle-node" />

      <!-- Arm 60 deg -->
      <g transform="rotate(60 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#ffffff" />
      </g>

      <!-- Arm -60 deg -->
      <g transform="rotate(-60 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#ffffff" />
      </g>

      <!-- Arm 120 deg -->
      <g transform="rotate(120 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#ffffff" />
      </g>

      <!-- Arm -120 deg -->
      <g transform="rotate(-120 60 60)">
        <line x1="60" y1="48" x2="60" y2="18" />
        <path d="M60,32 L70,22 M60,32 L50,22" stroke-width="2.5" />
        <circle cx="60" cy="15" r="3.5" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Typography Group -->
  <g transform="translate(132, 0)">
    <!-- Main Title "FrostMode" -->
    <text x="0" y="66" fill="url(#neonIceGrad)" class="main-title">FrostMode</text>
    
    <!-- Subtitle "LOCK IN. LEVEL UP." -->
    <text x="4" y="93" fill="#38bdf8" class="sub-tagline">LOCK IN. LEVEL UP.</text>
  </g>
</svg>
