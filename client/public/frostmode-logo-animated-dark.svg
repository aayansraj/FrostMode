<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="textIceGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="iconIceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Inter:wght@700&amp;display=swap');
    
    @keyframes logoSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes logoPulse {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .icon-spin {
      transform-origin: 60px 60px;
      animation: logoSpin 25s linear infinite;
    }
    .icon-pulse {
      transform-origin: 60px 60px;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .title-text {
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -1px;
    }
    .tagline-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 5px;
    }
  </style>

  <!-- Left Icon Group -->
  <g transform="translate(0, 0)" filter="url(#logoGlow)">
    <!-- Aura Glow Background -->
    <circle cx="60" cy="60" r="45" fill="#0284c7" opacity="0.25" class="icon-pulse" />

    <!-- Rotating Crystal Ring -->
    <g class="icon-spin" opacity="0.5">
      <circle cx="60" cy="60" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8"/>
    </g>

    <!-- Snowflake -->
    <g stroke="url(#iconIceGrad)" stroke-width="3" stroke-linecap="round">
      <!-- Hexagon Core -->
      <polygon points="60,49 69,54 69,66 60,71 51,66 51,54" fill="none" stroke-width="2" />
      <circle cx="60" cy="60" r="3" fill="#e0f2fe" />

      <!-- Arms -->
      <line x1="60" y1="49" x2="60" y2="20" />
      <path d="M60,32 L69,24 M60,32 L51,24" />
      <circle cx="60" cy="17" r="2.5" fill="#e0f2fe" />

      <line x1="60" y1="71" x2="60" y2="100" />
      <path d="M60,88 L69,96 M60,88 L51,96" />
      <circle cx="60" cy="103" r="2.5" fill="#e0f2fe" />

      <g transform="rotate(60 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#e0f2fe" />
      </g>

      <g transform="rotate(-60 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#e0f2fe" />
      </g>

      <g transform="rotate(120 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#e0f2fe" />
      </g>

      <g transform="rotate(-120 60 60)">
        <line x1="60" y1="49" x2="60" y2="20" />
        <path d="M60,32 L69,24 M60,32 L51,24" />
        <circle cx="60" cy="17" r="2.5" fill="#e0f2fe" />
      </g>
    </g>
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(130, 0)">
    <!-- Main Title -->
    <text x="0" y="66" fill="url(#textIceGradDark)" class="title-text" filter="url(#logoGlow)">FrostMode</text>
    
    <!-- Subtitle Tagline -->
    <text x="3" y="92" fill="#38bdf8" class="tagline-text" opacity="0.9">LOCK IN. LEVEL UP.</text>
  </g>
</svg>
